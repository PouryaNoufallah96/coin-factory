services:
  postgres:
    image: postgres:17-alpine
    container_name: coinfactory-postgres
    environment:
      POSTGRES_USER: coinfactory
      POSTGRES_PASSWORD: coinfactory
      POSTGRES_DB: coinfactory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coinfactory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinfactory -d coinfactory"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: coinfactory-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coinfactory}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coinfactory-minio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - coinfactory-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: coinfactory-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coinfactory}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coinfactory-minio}
      S3_BUCKET: ${S3_BUCKET:-coinfactory-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing \"local/$${S3_BUCKET}\";
      "
    restart: "no"

volumes:
  coinfactory-pgdata:
  coinfactory-minio-data:
